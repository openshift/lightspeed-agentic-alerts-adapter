apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-agentic-alerts-adapter
  namespace: openshift-lightspeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightspeed-agentic-alerts-adapter
  template:
    metadata:
      labels:
        app: lightspeed-agentic-alerts-adapter
    spec:
      serviceAccountName: lightspeed-agentic-alerts-adapter
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: alerts-adapter-config
      containers:
        - name: adapter
          image: quay.io/openshiftanalytics/lightspeed-agentic-alerts-adapter:latest
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alerts-adapter
              readOnly: true
          env:
            - name: ALERTMANAGER_URL
              value: https://alertmanager-main.openshift-monitoring.svc:9094
            # Comma-separated kubeconfig Secret names for spoke clusters.
            # Example: spoke-1,spoke-2
            - name: SPOKE_KUBECONFIG_SECRET_NAMES
              value: "spoke-1"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
