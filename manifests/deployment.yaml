apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-agentic-alerts-adapter
  namespace: openshift-lightspeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightspeed-agentic-alerts-adapter
  template:
    metadata:
      labels:
        app: lightspeed-agentic-alerts-adapter
    spec:
      serviceAccountName: lightspeed-agentic-alerts-adapter
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: alerts-adapter-config
        - name: tls-certs
          secret:
            secretName: lightspeed-agentic-alerts-adapter-tls
      containers:
        - name: adapter
          image: quay.io/openshiftanalytics/lightspeed-agentic-alerts-adapter:latest
          ports:
            - name: health
              containerPort: 8081
              protocol: TCP
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            tcpSocket:
              port: https
          readinessProbe:
            tcpSocket:
              port: https
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # Health server starts only after target discovery; allow up to 5 minutes.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /etc/alerts-adapter
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls/private
              readOnly: true
          env:
            - name: HTTPS_PORT
              value: "8443"
            - name: TLS_CERT_FILE
              value: /etc/tls/private/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/tls/private/tls.key
            # Direct deployment example; pin a verified skills image digest in production.
            # ConfigMap skill entries with explicit images override this default.
            - name: AGENTIC_SKILLS_IMAGE
              value: quay.io/openshiftanalytics/agentic-skills:latest
            - name: ALERTMANAGER_URL
              value: https://alertmanager-main.openshift-monitoring.svc:9094
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
