apiVersion: apps/v1
kind: Deployment
metadata:
  name: lightspeed-agentic-alerts-adapter
  namespace: openshift-lightspeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lightspeed-agentic-alerts-adapter
  template:
    metadata:
      labels:
        app: lightspeed-agentic-alerts-adapter
    spec:
      serviceAccountName: lightspeed-agentic-alerts-adapter
      securityContext:
        runAsNonRoot: true
      volumes:
        - name: config
          configMap:
            name: alerts-adapter-config
        - name: tls-certs
          secret:
            secretName: lightspeed-agentic-alerts-adapter-tls
      containers:
        - name: adapter
          image: quay.io/openshiftanalytics/lightspeed-agentic-alerts-adapter:latest
          ports:
            - name: https
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: config
              mountPath: /etc/alerts-adapter
              readOnly: true
            - name: tls-certs
              mountPath: /etc/tls/private
              readOnly: true
          env:
            - name: HTTP_PORT
              value: "8080"
            - name: TLS_CERT_FILE
              value: /etc/tls/private/tls.crt
            - name: TLS_KEY_FILE
              value: /etc/tls/private/tls.key
            # Direct deployment example; pin a verified skills image digest in production.
            # ConfigMap skill entries with explicit images override this default.
            - name: AGENTIC_SKILLS_IMAGE
              value: quay.io/openshiftanalytics/agentic-skills:latest
            - name: ALERTMANAGER_URL
              value: https://alertmanager-main.openshift-monitoring.svc:9094
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
