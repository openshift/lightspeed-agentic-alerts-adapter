apiVersion: v1
kind: Service
metadata:
  name: lightspeed-agentic-alerts-adapter
  namespace: openshift-lightspeed
  annotations:
    service.beta.openshift.io/serving-cert-secret-name: lightspeed-agentic-alerts-adapter-tls
spec:
  type: ClusterIP
  selector:
    app: lightspeed-agentic-alerts-adapter
  ports:
    - name: https
      port: 8080
      targetPort: https
      protocol: TCP
